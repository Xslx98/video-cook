[project]
name = "videocook"
version = "0.1.0"
description = "Assessment-first video encoding pipeline built on the VCB-S guides"
readme = "README.md"
authors = [
    { name = "Xslx98", email = "xszh8823@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dfttest2>=11.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "tomli-w>=1.2.0",
    "vapoursynth==80",
    "vapoursynth-akarin>=1.5.0",
    "vapoursynth-bm3dvk>=1.0.0",
    "vapoursynth-vszip>=22.1.0",
    "vapoursynth-vszipcl>=1.2.0",
    "vsjetpack[full,vulkan]>=2.2.4",
]

[project.scripts]
vcook = "videocook.cli:main"

[project.optional-dependencies]
nvidia = [
    "dfttest2[nvrtc]>=11.0.0",
    "vapoursynth-bm3dcuda>=2.17",
    "vapoursynth-mlrt-trt>=17.0",
    "vapoursynth-nlm-cuda>=5",
    "vapoursynth-vszipcu>=1.2.0",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
# bm3dcpu is still an API 3 build that R80 refuses to load; BM3D comes from bm3dvk / bm3dcuda.
override-dependencies = ["vapoursynth-bm3dcpu; sys_platform == 'never'"]
